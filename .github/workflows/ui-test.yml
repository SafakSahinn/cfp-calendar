name: Tarayıcı testi

# Canlı sitede geçici bir kullanıcıyla gerçek arayüzü kullanır (masaüstü + mobil), ekran görüntülerini yükler.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ui
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: jobs/screenshots
