name: Veri çek ve dağıt

on:
  schedule:
    - cron: '17 */12 * * *' # 12 saatte bir (UTC 00:17 ve 12:17); tam saatten kaçınmak kuyruk gecikmesini azaltır
  workflow_dispatch:
    inputs:
      step:
        description: 'Çalışacak adım'
        type: choice
        options: [all, fetch, geocode, dispatch, push, push-test, email]
        default: all
      test_to_admin:
        description: 'E-posta denemesi: SADECE yönetici adresine gönder (diğer üyelere gitmez)'
        type: boolean
        default: false
      force_weekly:
        description: 'Haftalık özeti pazartesiyi beklemeden gönder'
        type: boolean
        default: false
      force_report:
        description: 'Yönetici raporunu bugün gönderilmiş olsa da yeniden gönder (deneme)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # keepalive: 60 gün commit gelmezse zamanlanmış işler durmasın

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jobs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run job -- ${{ inputs.step || 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MEMBER_EMAILS: ${{ vars.MEMBER_EMAILS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          EMAIL_ONLY_TO: ${{ inputs.test_to_admin && vars.ADMIN_EMAIL || '' }}
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '' }}
          FORCE_ADMIN_REPORT: ${{ inputs.force_report && '1' || '' }}
      - uses: liskin/gh-workflow-keepalive@v1
        if: always() # veri adımı hata verse de zamanlanmış iş kapanmasın
