<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta property="og:image" content="https://safaksahinn.github.io/cfp-calendar/logo-180.png" />
